# Same baseline as the maintained Python source adapters, independent of host config.
line-length = 100
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
# The flat country adapter and shared namespace are local in every checkout.
# Classify them explicitly so lint does not depend on the caller's directory.
known-first-party = ["far_retail", "join_board", "sap_flight", "sap_modern", "shared", "meinpraktikum", "organisations", "network"]
