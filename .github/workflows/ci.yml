name: Country MCP CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20
            python: '3.11'
          - node: 22
            python: '3.12'
          - node: 24
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e 'packages/source-adapters[dev]' -e 'countries/de/stepstone[test]'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
        env:
          JOB_MARKET_PYTHON: python
          EGYPT_JOBS_PYTHON: python
      - run: python scripts/test-python.py
      - run: python -m ruff check packages/source-adapters/src packages/source-adapters/tests
      - run: npm audit --audit-level=high
